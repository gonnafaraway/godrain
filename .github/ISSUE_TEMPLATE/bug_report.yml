name: Bug report
description: Report incorrect behavior in godrain
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. For security issues, use [SECURITY.md](../SECURITY.md) instead.
  - type: input
    id: version
    attributes:
      label: godrain version
      description: Output of `godrain version`
      placeholder: v0.1.0
    validations:
      required: true
  - type: input
    id: go-version
    attributes:
      label: Go version
      placeholder: go1.22.10
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS / arch
      placeholder: linux/amd64
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command
      description: Exact godrain invocation
      render: bash
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include verdict/report snippets when possible
      render: text
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction notes
      description: Load shape, warmup/duration, whether pprof used gc=1, allowlist/load flags
    validations:
      required: false
